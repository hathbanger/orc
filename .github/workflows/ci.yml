name: ci

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck orc hud.sh hud.sh.in install.sh build.sh test/run.sh test/fusion_dogfood.sh test/fusion_real_smoke.sh

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: verify generated scripts are assembled from sources
        run: |
          ./build.sh
          git diff --exit-code orc hud.sh
      - name: run tests
        run: ./test/run.sh
      - name: run Fusion tests
        run: make test dogfood
