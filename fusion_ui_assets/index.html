<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>ORC · Control room</title>
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <script src="/appearance.js"></script>
    <link rel="stylesheet" href="/style.css" />
    <link rel="stylesheet" href="/brand.css" />
    <link rel="stylesheet" href="/woodland.css" />
    <link rel="stylesheet" href="/learning-game.css" />
    <script src="/brand.js" defer></script>
    <script src="/vendor/marked.js" defer></script>
    <script src="/vendor/purify.js" defer></script>
    <script src="/logic.js" defer></script>
    <script src="/truffle.js" defer></script>
    <script src="/learning-game.js" defer></script>
    <script src="/routing.js" defer></script>
    <script src="/app.js" defer></script>
  </head>
  <body>
    <aside class="sidebar">
      <a class="brand" href="#overview" aria-label="ORC home">
        <span class="brand-crest"><svg viewBox="250 150 1280 595" role="img" aria-label="ORC — tusked orc emblem and wordmark"><image href="/brand/orc-logo.png" width="1774" height="887" /></svg></span>
        <span class="brand-label">THE GUILD · CONTROL ROOM</span>
      </a>
      <div class="workspace-label">
        WORKSPACE
        <button
          id="add-workspace"
          class="icon-button"
          aria-label="Add workspace"
        >
          +
        </button>
      </div>
      <select id="workspace" aria-label="Workspace"></select>
      <div id="workspace-path" class="workspace-path"></div>
      <nav aria-label="Main navigation">
        <button data-view="overview" class="nav-item active">
          <span data-brand-icon="orc" aria-hidden="true"></span> Overview <kbd>1</kbd>
        </button>
        <button data-view="workflows" class="nav-item">
          <span data-brand-icon="forge" aria-hidden="true"></span> Workflows <kbd>2</kbd>
        </button>
        <button data-view="truffle" class="nav-item">
          <span data-brand-icon="truffle" aria-hidden="true"></span> Truffle pig
        </button>
        <button data-view="routing" class="nav-item">
          <span data-brand-icon="compass" aria-hidden="true"></span> Routing
        </button>
        <button data-view="decisions" class="nav-item">
          <span data-brand-icon="rune" aria-hidden="true"></span> Laya lab <kbd>3</kbd>
        </button>
        <button data-view="models" class="nav-item">
          <span data-brand-icon="library" aria-hidden="true"></span> ORC models <kbd>4</kbd>
        </button>
        <button data-view="settings" class="nav-item">
          <span data-brand-icon="gear" aria-hidden="true"></span> Settings <kbd>5</kbd>
        </button>
      </nav>
      <div class="sidebar-bottom">
        <button class="subtle guild-guide-link" data-action="guild-guide"><span data-brand-icon="scroll" aria-hidden="true"></span> Meet the guild</button>
        <button
          id="appearance"
          class="appearance-shortcut"
          data-action="appearance"
        >
          <span>◐ Appearance</span><small id="appearance-name"></small>
        </button>
        <div class="local-status">
          <i></i> Local connection <span id="connection">live</span>
        </div>
        <p>Big tusks. Small diffs.<br />Show your work.</p>
        <button id="shortcuts" class="subtle">
          Keyboard shortcuts <kbd>?</kbd>
        </button>
      </div>
    </aside>
    <main>
      <header class="topbar">
        <div class="breadcrumb">
          ORC <span>/</span> <span id="view-name">Overview</span>
        </div>
        <div class="top-actions">
          <div class="runtime-status">
            <span
              id="execution-chip"
              class="pill"
              title="Runtime access for new launches and retries"
              >Runtime</span
            ><span id="mode-chip" class="pill">Laya · shadow</span>
          </div>
          <button id="launch-top" class="button primary">
            <span>+</span> New run <kbd>N</kbd>
          </button>
        </div>
      </header>
      <div id="error-banner" class="error-banner" hidden></div>
      <div id="content" tabindex="-1">
        <div class="empty">
          <div class="loader"></div>
          <h2>Connecting to your workspace</h2>
          <p>Reading saved runs and worker activity.</p>
        </div>
      </div>
    </main>
    <dialog id="dialog" aria-labelledby="dialog-title">
      <div id="dialog-content"></div>
    </dialog>
    <div id="toast" role="status" aria-live="polite"></div>
  </body>
</html>
